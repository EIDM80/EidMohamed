  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      // ---- deterministic sine-wave path builder (no Date.now / no Math.random) ----
      function buildWavePath(width, height, cycles, amplitude, steps) {
        var midY = height / 2;
        var d = "";
        for (var i = 0; i <= steps; i++) {
          var t = i / steps;
          var x = t * width;
          var y = midY - Math.sin(t * Math.PI * 2 * cycles) * amplitude;
          d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
        }
        return d.trim();
      }

      var pathTop = document.getElementById("f03bands-wave-path-top");
      var pathBottom = document.getElementById("f03bands-wave-path-bottom");
      // 2.4GHz: long wavelength, generous amplitude — reads as a slow, far-reaching wave.
      pathTop.setAttribute("d", buildWavePath(768, 150, 2, 42, 160));
      // 5GHz: short wavelength, tighter amplitude — reads as a quick, tightly-packed ripple.
      pathBottom.setAttribute("d", buildWavePath(768, 150, 9, 22, 220));

      var waveWrapTop = document.getElementById("f03bands-wave-wrap-top");
      var waveWrapBottom = document.getElementById("f03bands-wave-wrap-bottom");

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.0 – 2.3s): title settles, two empty card outlines split-tilt in =====
      tl.fromTo(
        "#f03bands-title",
        { y: -46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.05,
      );

      // Split-tilt entry — mirrored rotateX (vertical book-open for the portrait stack).
      tl.fromTo(
        "#f03bands-card-top",
        { y: -230, rotateX: -22, opacity: 0 },
        { y: 0, rotateX: -14, opacity: 1, duration: 0.9, ease: "power3.out" },
        0.2,
      );
      tl.fromTo(
        "#f03bands-card-bottom",
        { y: 230, rotateX: 22, opacity: 0 },
        { y: 0, rotateX: 14, opacity: 1, duration: 0.9, ease: "power3.out" },
        0.42,
      );

      // Ambient ink glow blooms land on each card's settle.
      tl.fromTo(
        "#f03bands-glow-top",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.22, scale: 1, duration: 0.9, ease: "power2.out" },
        0.5,
      );
      tl.fromTo(
        "#f03bands-glow-bottom",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.22, scale: 1, duration: 0.9, ease: "power2.out" },
        0.7,
      );

      // Counter-phase idle bob on the settled pair (finite — reads alive, then goes still).
      tl.to(
        "#f03bands-card-top",
        { y: -4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 },
        1.4,
      );
      tl.to(
        "#f03bands-card-bottom",
        { y: 4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 },
        1.4,
      );

      // ===== Scene 2 (2.3 – 5.7s): "2.4 gigahertz — travels far, goes slow" =====
      tl.fromTo(
        "#f03bands-tag-top",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        2.3,
      );
      tl.fromTo(
        "#f03bands-label-top",
        { opacity: 0, y: 18, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        2.35,
      );
      // Long, slow wave stretches across the card's full width.
      tl.fromTo(
        waveWrapTop,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 1.3, ease: "power2.out" },
        2.5,
      );
      // Pill badge spring-pops at the card's inner (bottom) edge — the lone overshoot.
      tl.fromTo(
        "#f03bands-badge-top",
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" },
        3.9,
      );

      // Slow idle wobble on the long wave — low amplitude, fades out before the hold.
      (function () {
        var phase = { p: 0 };
        var START = 4.4;
        var DUR = 3.9; // ends 8.3s — settled before the frame's final beat
        var CYCLES = 1.4;
        var AMP = 5;
        var FADE_FRAC = 0.25;
        tl.to(
          phase,
          {
            p: Math.PI * 2 * CYCLES,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              var t = phase.p / (Math.PI * 2 * CYCLES);
              var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
              var s = Math.sin(phase.p) * AMP * env;
              waveWrapTop.style.transform = "translateX(" + s + "px)";
            },
          },
          START,
        );
      })();

      // ===== Scene 3 (5.7 – 9.493s): "5 gigahertz — fast, but it doesn't go as far" =====
      tl.fromTo(
        "#f03bands-tag-bottom",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        5.7,
      );
      tl.fromTo(
        "#f03bands-label-bottom",
        { opacity: 0, y: 18, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
        5.78,
      );
      // Short, fast wave ripples tightly across the card — a quick, snappy reveal.
      tl.fromTo(
        waveWrapBottom,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.out" },
        5.9,
      );
      // Pill badge spring-pops at the card's inner (top) edge.
      tl.fromTo(
        "#f03bands-badge-bottom",
        { scale: 0, opacity: 0, y: -10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" },
        6.5,
      );

      // Fast idle wobble on the short wave — tighter period, fades out before the hold.
      (function () {
        var phase = { p: 0 };
        var START = 6.95;
        var DUR = 1.55; // ends 8.5s
        var CYCLES = 1.7;
        var AMP = 3;
        var FADE_FRAC = 0.3;
        tl.to(
          phase,
          {
            p: Math.PI * 2 * CYCLES,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              var t = phase.p / (Math.PI * 2 * CYCLES);
              var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
              var s = Math.sin(phase.p) * AMP * env;
              waveWrapBottom.style.transform = "translateX(" + s + "px)";
            },
          },
          START,
        );
      })();

      // Both cards hold, settled, side by side top/bottom through the end.

      window.__timelines = window.__timelines || {};
      window.__timelines["03-bands"] = tl;

    })();
