      <script>
        (function () {
          var WAVE_W = 900;
          var WAVE_H = 360;
          var MID_Y = WAVE_H / 2;
          var SAMPLES = 160;

          function buildWaveD(amp, freq, phase) {
            var d = "";
            for (var i = 0; i <= SAMPLES; i++) {
              var x = (i / SAMPLES) * WAVE_W;
              var t = (i / SAMPLES) * freq * Math.PI * 2 + phase;
              var y = MID_Y - amp * Math.sin(t);
              d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
            }
            return d.trim();
          }

          var wavePath = document.getElementById("enc-wave-path");
          var waveState = { amp: 70, freq: 4, phase: 0 };

          function redrawWave() {
            wavePath.setAttribute("d", buildWaveD(waveState.amp, waveState.freq, waveState.phase));
          }

          // initial calm path, then reveal it with a measured stroke draw
          redrawWave();
          var waveLen = wavePath.getTotalLength();
          wavePath.style.strokeDasharray = String(waveLen);
          wavePath.style.strokeDashoffset = String(waveLen);

          // deterministic bit-stream strip
          var BIT_PATTERN = "1011001101001110100101100111010010110100111010010110011101001011001101";
          var stripEl = document.getElementById("enc-ticker-strip");
          stripEl.textContent = (BIT_PATTERN + " ").repeat(4);

          var counterEl = document.getElementById("enc-counter-num");
          var counterState = { value: 0 };

          var tl = gsap.timeline({ paused: true });

          // ---- Scene 1 (0.0 - 2.8s): calm wave draws in ----
          tl.fromTo(
            "#enc-wave-path",
            { strokeDashoffset: waveLen },
            {
              strokeDashoffset: 0,
              duration: 0.85,
              ease: "power2.out",
              onComplete: function () {
                wavePath.style.strokeDasharray = "none";
                wavePath.style.strokeDashoffset = "0";
              },
            },
            0,
          );
          tl.fromTo(".enc-kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);

          // ---- Scene 2 (2.8 - 6.5s): amplitude -> phase -> frequency ----

          // AMPLITUDE beat
          tl.fromTo(
            "#enc-label-amp",
            { opacity: 0, scale: 1.15, filter: "blur(8px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
            2.8,
          );
          tl.to(waveState, { amp: 130, duration: 0.55, ease: "power2.out", onUpdate: redrawWave }, 2.85);
          tl.to(waveState, { amp: 70, duration: 0.55, ease: "power2.inOut", onUpdate: redrawWave }, 3.4);
          tl.to(
            "#enc-label-amp",
            { opacity: 0, scale: 1.15, filter: "blur(8px)", duration: 0.28, ease: "power2.inOut" },
            3.75,
          );

          // PHASE beat
          tl.fromTo(
            "#enc-label-phase",
            { opacity: 0, scale: 1.15, filter: "blur(8px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
            4.03,
          );
          tl.to(waveState, { phase: Math.PI * 1.6, duration: 1.0, ease: "sine.inOut", onUpdate: redrawWave }, 4.1);
          tl.to(
            "#enc-label-phase",
            { opacity: 0, scale: 1.15, filter: "blur(8px)", duration: 0.28, ease: "power2.inOut" },
            4.95,
          );

          // FREQUENCY beat
          tl.fromTo(
            "#enc-label-freq",
            { opacity: 0, scale: 1.15, filter: "blur(8px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
            5.27,
          );
          tl.to(waveState, { freq: 9, duration: 0.6, ease: "power2.out", onUpdate: redrawWave }, 5.35);
          tl.to(waveState, { freq: 6, duration: 0.5, ease: "power2.inOut", onUpdate: redrawWave }, 5.95);
          tl.to(
            "#enc-label-freq",
            { opacity: 0, scale: 1.15, filter: "blur(8px)", duration: 0.28, ease: "power2.inOut" },
            6.15,
          );

          // ---- Scene 3 (6.5 - 9.3s): bit stream ticks + counter climbs ----
          tl.fromTo(".enc-ticker-row", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.5);
          tl.fromTo("#enc-ticker-strip", { x: 0 }, { x: -1600, duration: 2.3, ease: "none" }, 6.8);
          tl.to(
            "#enc-ticker-strip",
            { y: 3, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 },
            9.1,
          );

          tl.fromTo(".enc-counter-group", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.8);
          tl.fromTo(
            ".enc-counter-label",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
            6.85,
          );
          tl.fromTo(
            counterEl,
            { scale: 0.55 },
            { scale: 1, duration: 1.7, ease: "power3.out" },
            6.9,
          );
          tl.to(
            counterState,
            {
              value: 9600,
              duration: 1.7,
              ease: "power3.out",
              onUpdate: function () {
                counterEl.textContent = Math.round(counterState.value).toLocaleString();
              },
            },
            6.9,
          );
          tl.fromTo(
            ".enc-counter-suffix",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },

          // ---- Scene 4 (9.3 - 11.584s): settle, subtle jitter only ----

            9.3,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["04-encoding"] = tl;
          tl.seek(0);
        })();
