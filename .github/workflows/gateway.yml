name: gateway

on:
  push:
    paths: ["dify-gateway/**", ".github/workflows/gateway.yml"]
  pull_request:
    paths: ["dify-gateway/**", ".github/workflows/gateway.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dify-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dify-gateway/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      # A workflow that lost its tenant filter must not reach production.
      - name: Tenant isolation check on exported workflows
        run: python -m scripts.check_workflow_dsl workflows/*.yml

      - name: Migrations apply cleanly
        env:
          GATEWAY_DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: alembic upgrade head
